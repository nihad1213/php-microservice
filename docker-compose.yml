services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:8000"
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:8002:8002"
      - "127.0.0.1:8003:8003"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
      - auth
      - tasks
      - notifications

  gateway:
    build: ./docker/php
    volumes:
      - ./services/gateway:/var/www/html
      - ./shared:/var/shared:ro

  auth:
    build: ./docker/php
    volumes:
      - ./services/auth:/var/www/html
      - ./shared:/var/shared:ro
    depends_on:
      - mysql

  tasks:
    build: ./docker/php
    volumes:
      - ./services/tasks:/var/www/html
      - ./shared:/var/shared:ro
    depends_on:
      - mysql

  notifications:
    build: ./docker/php
    volumes:
      - ./services/notifications:/var/www/html
      - ./shared:/var/shared:ro
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: mysql
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - mysql

volumes:
  mysql_data:
