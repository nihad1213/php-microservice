services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:8000"   # gateway
      - "8001:8001"   # auth
      - "8002:8002"   # tasks
      - "8003:8003"   # notifications
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
      - auth
      - tasks
      - notifications

  gateway:
    image: php:8.3-fpm
    volumes:
      - ./services/gateway:/var/www/html

  auth:
    image: php:8.3-fpm
    volumes:
      - ./services/auth:/var/www/html

  tasks:
    image: php:8.3-fpm
    volumes:
      - ./services/tasks:/var/www/html

  notifications:
    image: php:8.3-fpm
    volumes:
      - ./services/notifications:/var/www/html

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: mysql
    ports:
      - "8081:80"
    depends_on:
      - mysql

volumes:
  mysql_data: